<div class="hubbles-container">
    <div class="fork-wrapper">
        
        <!-- Ствол: Эллиптические галактики -->
        <div>
            <div class="section-title">Эллиптические (Гладкие облака)</div>
            <div class="stem">
                <div class="galaxy-badge" title="Сферическая галактика (E0)">
                    <svg width="50" height="50" style="background:#050510; border-radius:4px;"><circle cx="25" cy="25" r="14" fill="#ffffff" style="filter:blur(3px); opacity:0.9;"/><circle cx="25" cy="25" r="6" fill="#ffffff" style="filter:blur(1px);"/></svg>
                    <span>E0</span>
                </div>
                <div class="galaxy-badge" title="Слегка вытянутая (E3)">
                    <svg width="50" height="50" style="background:#050510; border-radius:4px;"><ellipse cx="25" cy="25" rx="18" ry="12" fill="#ffffff" style="filter:blur(3px); opacity:0.9;"/><ellipse cx="25" cy="25" rx="9" ry="5" fill="#ffffff" style="filter:blur(1px);"/></svg>
                    <span>E3</span>
                </div>
                <div class="galaxy-badge" title="Умеренно сплюснутая (E5)">
                    <svg width="50" height="50" style="background:#050510; border-radius:4px;"><ellipse cx="25" cy="25" rx="21" ry="9" fill="#ffffff" style="filter:blur(2.5px); opacity:0.9;"/><ellipse cx="25" cy="25" rx="11" ry="3" fill="#ffffff" style="filter:blur(1px);"/></svg>
                    <span>E5</span>
                </div>
                <div class="galaxy-badge" title="Максимально вытянутый овал (E7)">
                    <svg width="50" height="50" style="background:#050510; border-radius:4px;"><ellipse cx="25" cy="25" rx="23" ry="5" fill="#ffffff" style="filter:blur(2px); opacity:0.9;"/><ellipse cx="25" cy="25" rx="13" ry="1.5" fill="#ffffff" style="filter:blur(0.5px);"/></svg>
                    <span>E7</span>
                </div>
            </div>
        </div>

        <!-- Центр: Линзовидный переходный класс -->
        <div class="node-s0" title="Линзовидная галактика (S0 - диск без рукавов)">
            <svg width="55" height="55" style="background:#050510; border-radius:50%;"><circle cx="27" cy="27" r="7" fill="#ffffff" style="filter:blur(1px);"/><ellipse cx="27" cy="27" rx="24" ry="3" fill="#ffffff" style="filter:blur(0.5px); opacity:0.8;"/></svg>
            <span class="node-text">S0</span>
        </div>

        <!-- Зубцы вилки: Спиральные классы -->
        <div class="teeth-container">
            
            <!-- Upper Tooth: Нормальные спирали -->
            <div>
                <div class="section-title">Обычные спирали (S)</div>
                <div class="tooth-row">
                    <!-- Sa: Крупное ядро, тугие прижатые рукава -->
                    <div class="galaxy-badge" title="Sa: Крупное плотное ядро, спиральные рукава туго закручены и прижаты к центру">
                        <svg width="50" height="50" style="background:#050510; border-radius:4px;">
                            <!-- Массивное размытое ядро -->
                            <circle cx="25" cy="25" r="8" fill="#ffffff" style="filter:blur(1.5px); opacity:0.9;"/>
                            <circle cx="25" cy="25" r="4" fill="#ffffff"/>
                            <!-- Рукав 1 -->
                            <path d="M25,18 C33,18 33,31 25,32 C18,32 18,21 24,21" stroke="#4ba3e3" stroke-width="2" fill="none" stroke-linecap="round"/>
                            <!-- Рукав 2 -->
                            <path d="M25,32 C17,32 17,19 25,18 C32,18 32,29 26,29" stroke="#4ba3e3" stroke-width="2" fill="none" stroke-linecap="round"/>
                        </svg>
                        <span>Sa</span>
                    </div>

                    <!-- Sb: Сбалансированное ядро, умеренно раскрытая двойная спираль -->
                    <div class="galaxy-badge" title="Sb: Среднее ядро, классические четкие рукава умеренной раскрытости (как у Андромеды)">
                        <svg width="50" height="50" style="background:#050510; border-radius:4px;">
                            <!-- Среднее ядро -->
                            <circle cx="25" cy="25" r="4" fill="#ffffff" style="filter:blur(0.5px);"/>
                            <!-- Рукав 1 -->
                            <path d="M25,21 C36,19 38,34 29,38 C20,42 12,30 21,22" stroke="#58a6ff" stroke-width="2" fill="none" stroke-linecap="round"/>
                            <!-- Рукав 2 -->
                            <path d="M25,29 C14,31 12,16 21,12 C30,8 38,20 29,28" stroke="#58a6ff" stroke-width="2" fill="none" stroke-linecap="round"/>
                        </svg>
                        <span>Sb</span>
                    </div>

                    <!-- Sc: Крошечное ядро, максимально свободные размашистые рукава -->
                    <div class="galaxy-badge" title="Sc: Маленькое слабое ядро, рукава очень свободные, размашистые и клочковатые">
                        <svg width="50" height="50" style="background:#050510; border-radius:4px;">
                            <!-- Крошечное ядро-точка -->
                            <circle cx="25" cy="25" r="2" fill="#ffffff"/>
                            <!-- Рукав 1 -->
                            <path d="M25,23 C38,23 45,43 25,45 C7,45 8,15 23,10" stroke="#a5d6ff" stroke-width="1.7" stroke-dasharray="4,1" fill="none" stroke-linecap="round"/>
                            <!-- Рукав 2 -->
                            <path d="M25,27 C12,27 5,7 25,5 C43,5 42,35 27,40" stroke="#a5d6ff" stroke-width="1.7" stroke-dasharray="4,1" fill="none" stroke-linecap="round"/>
                        </svg>
                        <span>Sc</span>
                    </div>
                </div>
            </div>


            <!-- Lower Tooth: Спирали с баром -->
            <div>
                <div class="section-title">Спирали с перемычкой (SB)</div>
                <div class="tooth-row">
                    <div class="galaxy-badge" title="SBa: Рукава отходят от широкого бара">
                        <svg width="50" height="50" style="background:#050510; border-radius:4px;"><line x1="14" y1="25" x2="36" y2="25" stroke="#ffffff" stroke-width="5" style="filter:blur(1px);"/><path d="M14,25 C14,14 36,14 36,25 C36,36 14,36 14,25" stroke="#4ba3e3" stroke-width="2" fill="none"/></svg>
                        <span>SBa</span>
                    </div>
                    <div class="galaxy-badge" title="SBb: Четкий звездный мост (как Млечный Путь)">
                        <svg width="50" height="50" style="background:#050510; border-radius:4px;"><line x1="15" y1="25" x2="35" y2="25" stroke="#ffffff" stroke-width="3.5"/><path d="M15,25 Q15,6 30,11 M35,25 Q35,44 20,39" stroke="#58a6ff" stroke-width="2" fill="none"/></svg>
                        <span>SBb</span>
                    </div>
                    <div class="galaxy-badge" title="SBc: Тонкий длинный бар, рукава раскрыты">
                        <svg width="50" height="50" style="background:#050510; border-radius:4px;"><line x1="12" y1="25" x2="38" y2="25" stroke="#ffffff" stroke-width="2"/><path d="M12,25 C12,1 45,1 45,25 M38,25 C38,49 5,44 5,25" stroke="#a5d6ff" stroke-width="1.5" fill="none"/></svg>
                        <span>SBc</span>
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>
