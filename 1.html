<div class="hubbles-container">
    <div class="fork-wrapper">
        
        <!-- Ствол: Эллиптические галактики -->
        <div>
            <div class="section-title">Эллиптические (Гладкие облака)</div>
            <div class="stem">
                <div class="galaxy-badge" title="Сферическая галактика (E0)">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='50' height='50' viewBox='0 0 50 50'><rect width='50' height='50' fill='%23050510'/><circle cx='25' cy='25' r='18' fill='%23ffffff' filter='blur(3px)' opacity='0.9'/><circle cx='25' cy='25' r='8' fill='%23ffffff' filter='blur(1px)'/></svg>" class="galaxy-preview" alt="E0">
                    <span>E0</span>
                </div>
                <div class="galaxy-badge" title="Слегка вытянутая (E3)">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='50' height='50' viewBox='0 0 50 50'><rect width='50' height='50' fill='%23050510'/><ellipse cx='25' cy='25' rx='20' ry='15' fill='%23ffffff' filter='blur(3px)' opacity='0.9'/><ellipse cx='25' cy='25' rx='10' ry='6' fill='%23ffffff' filter='blur(1px)'/></svg>" class="galaxy-preview" alt="E3">
                    <span>E3</span>
                </div>
                <div class="galaxy-badge" title="Умеренно сплюснутая (E5)">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='50' height='50' viewBox='0 0 50 50'><rect width='50' height='50' fill='%23050510'/><ellipse cx='25' cy='25' rx='22' ry='11' fill='%23ffffff' filter='blur(2.5px)' opacity='0.9'/><ellipse cx='25' cy='25' rx='12' ry='4' fill='%23ffffff' filter='blur(1px)'/></svg>" class="galaxy-preview" alt="E5">
                    <span>E5</span>
                </div>
                <div class="galaxy-badge" title="Максимально вытянутый овал (E7)">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='50' height='50' viewBox='0 0 50 50'><rect width='50' height='50' fill='%23050510'/><ellipse cx='25' cy='25' rx='24' ry='6' fill='%23ffffff' filter='blur(2px)' opacity='0.9'/><ellipse cx='25' cy='25' rx='14' ry='2' fill='%23ffffff' filter='blur(0.5px)'/></svg>" class="galaxy-preview" alt="E7">
                    <span>E7</span>
                </div>
            </div>
        </div>

        <!-- Центр: Линзовидный переходный класс -->
        <div class="node-s0" title="Линзовидная галактика (S0 - диск без рукавов)">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='50' height='50' viewBox='0 0 50 50'><rect width='50' height='50' fill='%23050510'/><circle cx='25' cy='25' r='12' fill='%23ffffff' filter='blur(2px)'/><ellipse cx='25' cy='25' rx='23' ry='5' fill='%23ffffff' filter='blur(1px)' opacity='0.7'/></svg>" class="galaxy-preview circle-preview" alt="S0">
            <span class="node-text">S0</span>
        </div>

        <!-- Зубцы вилки: Спиральные классы -->
        <div class="teeth-container">
            
            <!-- Upper Tooth: Нормальные спирали -->
            <div>
                <div class="section-title">Обычные спирали (S)</div>
                <div class="tooth-row">
                    <div class="galaxy-badge" title="Sa: Крупное ядро, тугие рукава">
                        <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='50' height='50' viewBox='0 0 50 50'><rect width='50' height='50' fill='%23050510'/><circle cx='25' cy='25' r='10' fill='%23ffffff' filter='blur(2px)'/><path d='M25,15 Q35,15 33,25 Q30,35 25,35 Q15,35 17,25 Q20,15 25,15' stroke='%234ba3e3' stroke-width='2' fill='none' filter='blur(0.5px)'/></svg>" class="galaxy-preview" alt="Sa">
                        <span>Sa</span>
                    </div>
                    <div class="galaxy-badge" title="Sb: Сбалансированная спираль (как Андромеда)">
                        <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='50' height='50' viewBox='0 0 50 50'><rect width='50' height='50' fill='%23050510'/><circle cx='25' cy='25' r='7' fill='%23ffffff' filter='blur(1.5px)'/><path d='M25,10 C42,10 40,40 25,40 C10,40 8,10 25,10' stroke='%2358a6ff' stroke-width='2' fill='none'/></svg>" class="galaxy-preview" alt="Sb">
                        <span>Sb</span>
                    </div>
                    <div class="galaxy-badge" title="Sc: Свободные клочковатые рукава">
                        <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='50' height='50' viewBox='0 0 50 50'><rect width='50' height='50' fill='%23050510'/><circle cx='25' cy='25' r='4' fill='%23ffffff'/><path d='M25,5 C50,5 45,45 25,45 C5,45 0,5 25,5' stroke='%23a5d6ff' stroke-width='1.5' stroke-dasharray='3,3' fill='none'/></svg>" class="galaxy-preview" alt="Sc">
                        <span>Sc</span>
                    </div>
                </div>
            </div>

            <!-- Lower Tooth: Спирали с баром -->
            <div>
                <div class="section-title">Спирали с перемычкой (SB)</div>
                <div class="tooth-row">
                    <div class="galaxy-badge" title="SBa: Рукава отходят от широкого бара">
                        <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='50' height='50' viewBox='0 0 50 50'><rect width='50' height='50' fill='%23050510'/><line x1='13' y1='25' x2='37' y2='25' stroke='%23ffffff' stroke-width='5' filter='blur(1.5px)'/><path d='M13,25 C13,13 37,13 37,25 C37,37 13,37 13,25' stroke='%234ba3e3' stroke-width='2' fill='none'/></svg>" class="galaxy-preview" alt="SBa">
                        <span>SBa</span>
                    </div>
                    <div class="galaxy-badge" title="SBb: Четкий звездный мост (как Млечный Путь)">
                        <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='50' height='50' viewBox='0 0 50 50'><rect width='50' height='50' fill='%23050510'/><line x1='15' y1='25' x2='35' y2='25' stroke='%23ffffff' stroke-width='4' filter='blur(1px)'/><path d='M15,25 Q15,5 30,10 M35,25 Q35,45 20,40' stroke='%2358a6ff' stroke-width='2' fill='none'/></svg>" class="galaxy-preview" alt="SBb">
                        <span>SBb</span>
                    </div>
                    <div class="galaxy-badge" title="SBc: Тонкий длинный бар, рукава раскрыты">
                        <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='50' height='50' viewBox='0 0 50 50'><rect width='50' height='50' fill='%23050510'/><line x1='12' y1='25' x2='38' y2='25' stroke='%23ffffff' stroke-width='2'/><path d='M12,25 C12,0 45,0 45,25 M38,25 C38,50 5,50 5,25' stroke='%23a5d6ff' stroke-width='1.5' fill='none'/></svg>" class="galaxy-preview" alt="SBc">
                        <span>SBc</span>
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>
