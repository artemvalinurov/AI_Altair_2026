<div class="hubbles-container">
    <div class="fork-wrapper">
        
        <!-- Ствол: Эллиптические галактики -->
        <div>
            <div class="section-title">Эллиптические (Гладкие облака)</div>
            <div class="stem">
                <div class="galaxy-badge" title="Сферическая галактика">E0</div>
                <div class="galaxy-badge" title="Слегка вытянутая">E3</div>
                <div class="galaxy-badge" title="Умеренно сплюснутая">E5</div>
                <div class="galaxy-badge" title="Максимально вытянутый овал">E7</div>
            </div>
        </div>

        <!-- Центр: Линзовидный переходный класс -->
        <div class="node-s0" title="Линзовидная галактика (Есть ядро и диск, но нет рукавов)">S0</div>

        <!-- Зубцы вилки: Спиральные классы -->
        <div class="teeth-container">
            
            <!-- Верхний зубец: Нормальные спирали -->
            <div>
                <div class="section-title">Обычные спирали (S)</div>
                <div class="tooth-row">
                    <div class="galaxy-badge" title="Sa: Крупное ядро, тугие рукава">Sa</div>
                    <div class="galaxy-badge" title="Sb: Сбалансированная спираль (Как Андромеды)">Sb</div>
                    <div class="galaxy-badge" title="Sc: Свободные клочковатые рукава">Sc</div>
                </div>
            </div>

            <!-- Нижний зубец: Спирали с баром -->
            <div>
                <div class="section-title">Спирали с перемычкой (SB)</div>
                <div class="tooth-row">
                    <div class="galaxy-badge" title="SBa: Рукава отходят от широкого бара">SBa</div>
                    <div class="galaxy-badge" title="SBb: Четкий звездный мост (Как Млечный Путь)">SBb</div>
                    <div class="galaxy-badge" title="SBc: Тонкий длинный бар, рукава раскрыты">SBc</div>
                </div>
            </div>

        </div>

    </div>
</div>
